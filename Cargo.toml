[package]
name = "supra-verifier-solana"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Independent pair-bound Solana verification of Supra pull-oracle BLS and Merkle proofs"
license = "MIT"
repository = "https://github.com/zdenekbilek/supra-verifier-solana"
documentation = "https://docs.rs/supra-verifier-solana"
readme = "README.md"
keywords = ["solana", "supra", "oracle", "bls", "bn254"]
categories = ["cryptography"]
publish = ["crates-io"]
include = ["/src/**", "/tests/**", "/fixtures/**", "/catalog/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md", "/docs/**"]

[workspace]
members = ["examples/verify-proof"]
default-members = ["."]
resolver = "2"

[dependencies]
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["curve"] }
ark-ff = { version = "=0.5.0", default-features = false }
hex-literal = "=0.4.1"
solana-program = { version = "=3.0.0", default-features = false }
solana-bn254 = "=3.2.1"

[dev-dependencies]
hex = "=0.4.3"
serde_json = "=1.0.145"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
